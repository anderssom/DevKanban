<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevKanban - Cloud (Supabase)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#09090b] text-[#zinc-100] min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

    <!-- Cabeçalho estilo Shadcn -->
    <header class="bg-[#09090b]/80 backdrop-blur-md border-b border-[#27272a] p-3 sm:p-4 sticky top-0 z-40 flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center space-x-3">
            <div class="bg-white text-black p-2 rounded-md font-bold shadow-sm flex items-center justify-center">
                <i class="fa-solid fa-code text-base sm:text-lg"></i>
            </div>
            <div>
                <h1 class="text-base sm:text-lg font-semibold tracking-tight text-white">Dev<span class="text-indigo-400">Kanban</span></h1>
                <p id="sync-status" class="text-[10px] text-amber-400 font-medium">Conectando ao Supabase...</p>
            </div>
        </div>
        <div class="flex items-center space-x-2 sm:space-x-2.5">
            <button onclick="abrirModalConfigColunas()" class="bg-[#27272a] hover:bg-[#3f3f46] text-zinc-200 px-3 py-2 rounded-md font-medium text-xs sm:text-sm transition border border-[#3f3f46]/50 flex items-center space-x-1.5 shadow-xs">
                <i class="fa-solid fa-columns text-zinc-400"></i>
                <span class="hidden xs:inline">Colunas</span>
            </button>
            <button onclick="abrirModalProjeto()" class="bg-white hover:bg-zinc-200 text-zinc-900 px-3 sm:px-4 py-2 rounded-md font-medium text-xs sm:text-sm transition flex items-center space-x-1.5 shadow-sm">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>Novo Projeto</span>
            </button>
        </div>
    </header>

    <!-- Navegação por Abas -->
    <nav class="bg-[#09090b] border-b border-[#27272a] px-3 sm:px-6 pt-3 flex justify-between items-center overflow-x-auto">
        <div id="container-abas" class="flex space-x-2 pb-2"></div>
        <button onclick="abrirModalAba()" class="text-zinc-400 hover:text-zinc-200 bg-[#18181b] hover:bg-[#27272a] border border-[#27272a] px-3 py-1.5 rounded-md text-xs sm:text-sm transition flex items-center space-x-1 whitespace-nowrap mb-2 ml-2 shadow-xs">
            <i class="fa-solid fa-folder-plus"></i>
            <span>Nova Aba</span>
        </button>
    </nav>

    <!-- Quadro Kanban -->
    <main class="flex-1 p-3 sm:p-6 overflow-x-auto w-full bg-[#09090b]">
        <div id="kanban-board" class="flex gap-4 sm:gap-6 min-w-max pb-4"></div>
    </main>

    <!-- Modal: Adicionar Projeto (Estilo Dialog Shadcn) -->
    <div id="modal-projeto" class="fixed inset-0 bg-black/80 backdrop-blur-xs hidden items-center justify-center p-3 sm:p-4 z-50 animate-in fade-in duration-200">
        <div class="bg-[#18181b] border border-[#27272a] rounded-xl max-w-md w-full p-5 sm:p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-[#27272a]">
                <h3 class="text-base font-semibold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-laptop-code text-indigo-400"></i>
                    <span>Novo Projeto de Software</span>
                </h3>
                <button onclick="fecharModalProjeto()" class="text-zinc-400 hover:text-white p-1 text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="form-projeto" onsubmit="salvarProjeto(event)" class="space-y-3 sm:space-y-4">
                <div>
                    <label class="block text-xs font-medium text-zinc-300 mb-1.5">Nome do Projeto</label>
                    <input type="text" id="proj-nome" required class="w-full bg-[#09090b] border border-[#27272a] rounded-md p-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-zinc-400 text-white placeholder-zinc-600" placeholder="Ex: API de Pagamentos">
                </div>
                <div>
                    <label class="block text-xs font-medium text-zinc-300 mb-1.5">Descrição / Tech Stack</label>
                    <textarea id="proj-desc" rows="2" class="w-full bg-[#09090b] border border-[#27272a] rounded-md p-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-zinc-400 text-white placeholder-zinc-600" placeholder="Ex: Node.js, Express, PostgreSQL..."></textarea>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-zinc-300 mb-1.5"><i class="fa-brands fa-github mr-1"></i> Repo / Projeto</label>
                        <input type="url" id="proj-link" class="w-full bg-[#09090b] border border-[#27272a] rounded-md p-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-zinc-400 text-white placeholder-zinc-600" placeholder="https://github.com/...">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-zinc-300 mb-1.5"><i class="fa-solid fa-book mr-1"></i> Documentação</label>
                        <input type="url" id="proj-doc" class="w-full bg-[#09090b] border border-[#27272a] rounded-md p-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-zinc-400 text-white placeholder-zinc-600" placeholder="https://notion.so/...">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-zinc-300 mb-1.5"><i class="fa-brands fa-figma mr-1 text-pink-400"></i> Figma (Design)</label>
                        <input type="url" id="proj-figma" class="w-full bg-[#09090b] border border-[#27272a] rounded-md p-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-zinc-400 text-white placeholder-zinc-600" placeholder="https://figma.com/...">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-zinc-300 mb-1.5"><i class="fa-solid fa-compass-drafting mr-1 text-amber-400"></i> Whimsical (Fluxo)</label>
                        <input type="url" id="proj-whimsical" class="w-full bg-[#09090b] border border-[#27272a] rounded-md p-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-zinc-400 text-white placeholder-zinc-600" placeholder="https://whimsical.com/...">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-zinc-300 mb-1.5">Status Inicial</label>
                    <select id="proj-status" class="w-full bg-[#09090b] border border-[#27272a] rounded-md p-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-zinc-400 text-white"></select>
                </div>
                <div class="flex justify-end space-x-2 pt-3">
                    <button type="button" onclick="fecharModalProjeto()" class="bg-[#27272a] hover:bg-[#3f3f46] text-zinc-300 px-4 py-2 rounded-md text-sm transition">Cancelar</button>
                    <button type="submit" class="bg-white hover:bg-zinc-200 text-zinc-900 px-4 py-2 rounded-md text-sm transition font-medium shadow-sm">Salvar Projeto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Adicionar Aba -->
    <div id="modal-aba" class="fixed inset-0 bg-black/80 backdrop-blur-xs hidden items-center justify-center p-3 sm:p-4 z-50">
        <div class="bg-[#18181b] border border-[#27272a] rounded-xl max-w-sm w-full p-5 sm:p-6 shadow-2xl">
            <h3 class="text-base font-semibold mb-4 text-white flex items-center space-x-2">
                <i class="fa-solid fa-folder-plus text-indigo-400"></i>
                <span>Nova Aba Personalizada</span>
            </h3>
            <form id="form-aba" onsubmit="salvarAba(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-zinc-300 mb-1.5">Nome da Aba</label>
                    <input type="text" id="aba-nome" required class="w-full bg-[#09090b] border border-[#27272a] rounded-md p-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-zinc-400 text-white placeholder-zinc-600" placeholder="Ex: Backend, Mobile...">
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="fecharModalAba()" class="bg-[#27272a] hover:bg-[#3f3f46] text-zinc-300 px-4 py-2 rounded-md text-sm transition">Cancelar</button>
                    <button type="submit" class="bg-white hover:bg-zinc-200 text-zinc-900 px-4 py-2 rounded-md text-sm transition font-medium shadow-sm">Criar Aba</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Configurar Colunas -->
    <div id="modal-config-colunas" class="fixed inset-0 bg-black/80 backdrop-blur-xs hidden items-center justify-center p-3 sm:p-4 z-50">
        <div class="bg-[#18181b] border border-[#27272a] rounded-xl max-w-lg w-full p-5 sm:p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 class="text-base font-semibold mb-2 text-white flex items-center space-x-2">
                <i class="fa-solid fa-columns text-indigo-400"></i>
                <span>Gerenciar Etapas (Colunas)</span>
            </h3>
            <p class="text-xs text-zinc-400 mb-4">Reordene, renomeie ou adicione novas colunas ao seu fluxo.</p>
            <div id="lista-config-colunas" class="space-y-2 mb-4 max-h-[250px] overflow-y-auto pr-1"></div>
            <div class="border-t border-[#27272a] pt-3 flex justify-between items-center">
                <button type="button" onclick="adicionarColunaPrompt()" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium flex items-center space-x-1"><i class="fa-solid fa-plus"></i><span>Adicionar Coluna</span></button>
                <button type="button" onclick="fecharModalConfigColunas()" class="bg-white hover:bg-zinc-200 text-zinc-900 px-4 py-2 rounded-md text-sm transition font-medium shadow-sm">Concluir</button>
            </div>
        </div>
    </div>

    <!-- Script de Integração -->
    <script>
        const SUPABASE_URL = 'https://dhgllybqgknrsnyxcxdn.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_0GX8SNsEtJzQXzt4YgHqSQ_IeNp40p0';

        let dadosApp = {
            colunas: [
                { id: 'todo', nome: 'A Fazer', cor: 'bg-amber-500' },
                { id: 'config', nome: 'Configurando', cor: 'bg-blue-500' },
                { id: 'inprogress', nome: 'Em Andamento', cor: 'bg-indigo-500' },
                { id: 'testing', nome: 'Testando', cor: 'bg-purple-500' },
                { id: 'done', nome: 'Pronto', cor: 'bg-emerald-500' }
            ],
            abas: [
                { id: 'geral', nome: 'Geral / Fullstack' }
            ],
            abaAtiva: 'geral',
            projetos: []
        };

        async function carregarDadosDoSupabase() {
            const statusEl = document.getElementById('sync-status');
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/kanban_data?id=eq.main_board&select=content`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!response.ok) throw new Error('Erro ao buscar dados');
                const result = await response.json();

                if (result && result.length > 0 && result[0].content) {
                    dadosApp = result[0].content;
                    statusEl.textContent = '● Sincronizado na nuvem';
                    statusEl.className = 'text-[10px] text-emerald-400 font-medium';
                } else {
                    await salvarDadosNoSupabase();
                }
            } catch (err) {
                console.error('Erro ao carregar:', err);
                statusEl.textContent = '● Erro de conexão';
                statusEl.className = 'text-[10px] text-rose-400 font-medium';
            }
            renderizar();
        }

        async function salvarDados() {
            renderizar();
            const statusEl = document.getElementById('sync-status');
            statusEl.textContent = '● Salvando...';
            statusEl.className = 'text-[10px] text-amber-400 font-medium';

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/kanban_data`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'resolution=merge-duplicates'
                    },
                    body: JSON.stringify({ id: 'main_board', content: dadosApp, updated_at: new Date() })
                });

                if (!response.ok) throw new Error('Erro ao salvar');
                statusEl.textContent = '● Sincronizado na nuvem';
                statusEl.className = 'text-[10px] text-emerald-400 font-medium';
            } catch (err) {
                console.error('Erro ao salvar:', err);
                statusEl.textContent = '● Erro ao salvar';
                statusEl.className = 'text-[10px] text-rose-400 font-medium';
            }
        }

        async function salvarDadosNoSupabase() {
            await fetch(`${SUPABASE_URL}/rest/v1/kanban_data`, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'resolution=merge-duplicates'
                },
                body: JSON.stringify({ id: 'main_board', content: dadosApp })
            });
        }

        function renderizar() {
            renderizarAbas();
            renderizarQuadroKanban();
            atualizarSelectModalProjeto();
        }

        function renderizarAbas() {
            const container = document.getElementById('container-abas');
            container.innerHTML = '';
            dadosApp.abas.forEach(aba => {
                const ativa = aba.id === dadosApp.abaAtiva;
                const btn = document.createElement('button');
                btn.className = `px-3 sm:px-4 py-2 text-xs sm:text-sm font-medium rounded-t-lg transition flex items-center space-x-2 border-b-2 whitespace-nowrap ${ativa ? 'bg-[#18181b] text-white border-white shadow-xs' : 'text-zinc-400 hover:text-zinc-200 border-transparent hover:bg-[#18181b]/50'}`;
                btn.innerHTML = `<span>${aba.nome}</span>${dadosApp.abas.length > 1 ? `<i class="fa-solid fa-xmark ml-2 text-xs hover:text-red-400" onclick="event.stopPropagation(); deletarAba('${aba.id}')"></i>` : ''}`;
                btn.onclick = () => { dadosApp.abaAtiva = aba.id; salvarDados(); };
                container.appendChild(btn);
            });
        }

        function renderizarQuadroKanban() {
            const board = document.getElementById('kanban-board');
            board.innerHTML = '';
            let counts = {};
            dadosApp.colunas.forEach(col => counts[col.id] = 0);
            const projetosFiltrados = dadosApp.projetos.filter(p => p.abaId === dadosApp.abaAtiva);
            projetosFiltrados.forEach(proj => { if (counts[proj.status] !== undefined) counts[proj.status]++; });

            dadosApp.colunas.forEach(col => {
                const colDiv = document.createElement('div');
                colDiv.className = 'bg-[#121214] border border-[#27272a] rounded-xl p-3 sm:p-4 flex flex-col shadow-lg w-[290px] sm:w-[320px] shrink-0';
                colDiv.innerHTML = `
                    <div class="flex justify-between items-center mb-3 pb-2 border-b border-[#27272a]">
                        <h2 class="font-semibold text-zinc-200 text-xs sm:text-sm flex items-center space-x-2">
                            <span class="w-2.5 h-2.5 rounded-full ${col.cor} inline-block"></span>
                            <span class="truncate max-w-[170px]">${col.nome}</span>
                        </h2>
                        <span class="bg-[#27272a] text-zinc-300 text-xs px-2 py-0.5 rounded-full font-bold">${counts[col.id] || 0}</span>
                    </div>
                    <div id="coluna-${col.id}" class="flex-1 space-y-3 overflow-y-auto min-h-[350px] max-h-[65vh]" ondragover="permitirDrop(event)" ondrop="dropar(event, '${col.id}')"></div>
                `;
                board.appendChild(colDiv);

                const containerCards = colDiv.querySelector(`#coluna-${col.id}`);
                projetosFiltrados.filter(p => p.status === col.id).forEach(proj => {
                    const card = document.createElement('div');
                    card.className = 'bg-[#18181b] border border-[#27272a] rounded-lg p-3 sm:p-4 shadow-sm hover:border-[#3f3f46] transition cursor-grab active:cursor-grabbing group relative';
                    card.draggable = true;
                    card.ondragstart = (e) => e.dataTransfer.setData('text/plain', proj.id);
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="font-semibold text-zinc-100 text-xs sm:text-sm tracking-wide pr-6">${proj.nome}</h4>
                            <button onclick="deletarProjeto('${proj.id}')" class="text-zinc-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition absolute right-2 top-2 p-1"><i class="fa-solid fa-trash-can text-xs"></i></button>
                        </div>
                        <p class="text-xs text-zinc-400 mb-3 line-clamp-2">${proj.desc || 'Sem descrição.'}</p>
                        <div class="flex flex-wrap gap-1.5 pt-2 border-t border-[#27272a] text-[11px]">
                            ${proj.link ? `<a href="${proj.link}" target="_blank" class="bg-zinc-800/80 text-zinc-300 hover:bg-zinc-700 px-2 py-0.5 rounded border border-[#3f3f46]/50 flex items-center space-x-1"><i class="fa-brands fa-github"></i><span>Repo</span></a>` : ''}
                            ${proj.doc ? `<a href="${proj.doc}" target="_blank" class="bg-blue-950/40 text-blue-300 hover:bg-blue-900/50 px-2 py-0.5 rounded border border-blue-800/30 flex items-center space-x-1"><i class="fa-solid fa-book"></i><span>Docs</span></a>` : ''}
                            ${proj.figma ? `<a href="${proj.figma}" target="_blank" class="bg-pink-950/40 text-pink-300 hover:bg-pink-900/50 px-2 py-0.5 rounded border border-pink-800/30 flex items-center space-x-1"><i class="fa-brands fa-figma"></i><span>Figma</span></a>` : ''}
                            ${proj.whimsical ? `<a href="${proj.whimsical}" target="_blank" class="bg-amber-950/40 text-amber-300 hover:bg-amber-900/50 px-2 py-0.5 rounded border border-amber-800/30 flex items-center space-x-1"><i class="fa-solid fa-compass-drafting"></i><span>Whimsical</span></a>` : ''}
                        </div>
                    `;
                    containerCards.appendChild(card);
                });
            });
        }

        function atualizarSelectModalProjeto() {
            const select = document.getElementById('proj-status');
            select.innerHTML = '';
            dadosApp.colunas.forEach(col => {
                const opt = document.createElement('option');
                opt.value = col.id; opt.textContent = col.nome;
                select.appendChild(opt);
            });
        }

        function permitirDrop(e) { e.preventDefault(); }
        function dropar(e, novoStatus) {
            e.preventDefault();
            const projId = e.dataTransfer.getData('text/plain');
            const projeto = dadosApp.projetos.find(p => p.id === projId);
            if (projeto) { projeto.status = novoStatus; salvarDados(); }
        }

        function abrirModalProjeto() { document.getElementById('modal-projeto').classList.remove('hidden'); document.getElementById('modal-projeto').classList.add('flex'); }
        function fecharModalProjeto() { document.getElementById('modal-projeto').classList.remove('flex'); document.getElementById('modal-projeto').classList.add('hidden'); document.getElementById('form-projeto').reset(); }
        function abrirModalAba() { document.getElementById('modal-aba').classList.remove('hidden'); document.getElementById('modal-aba').classList.add('flex'); }
        function fecharModalAba() { document.getElementById('modal-aba').classList.remove('flex'); document.getElementById('modal-aba').classList.add('hidden'); document.getElementById('form-aba').reset(); }
        function abrirModalConfigColunas() { renderizarListaConfigColunas(); document.getElementById('modal-config-colunas').classList.remove('hidden'); document.getElementById('modal-config-colunas').classList.add('flex'); }
        function fecharModalConfigColunas() { document.getElementById('modal-config-colunas').classList.remove('flex'); document.getElementById('modal-config-colunas').classList.add('hidden'); salvarDados(); }

        function renderizarListaConfigColunas() {
            const container = document.getElementById('lista-config-colunas');
            container.innerHTML = '';
            dadosApp.colunas.forEach((col, index) => {
                const item = document.createElement('div');
                item.className = 'bg-[#09090b] border border-[#27272a] rounded-lg p-2.5 sm:p-3 flex items-center justify-between gap-2';
                item.innerHTML = `
                    <div class="flex items-center space-x-2 flex-1 min-w-0">
                        <select onchange="mudarCorColuna('${col.id}', this.value)" class="bg-[#18181b] border border-[#27272a] rounded px-1 py-1 text-xs text-white shrink-0">
                            <option value="bg-amber-500" ${col.cor === 'bg-amber-500' ? 'selected' : ''}>🟡</option>
                            <option value="bg-blue-500" ${col.cor === 'bg-blue-500' ? 'selected' : ''}>🔵</option>
                            <option value="bg-indigo-500" ${col.cor === 'bg-indigo-500' ? 'selected' : ''}>🟣</option>
                            <option value="bg-purple-500" ${col.cor === 'bg-purple-500' ? 'selected' : ''}>💜</option>
                            <option value="bg-emerald-500" ${col.cor === 'bg-emerald-500' ? 'selected' : ''}>🟢</option>
                        </select>
                        <input type="text" value="${col.nome}" onchange="renomearColuna('${col.id}', this.value)" class="bg-[#18181b] border border-[#27272a] rounded px-2 py-1 text-xs text-white flex-1 focus:outline-none focus:ring-1 focus:ring-zinc-400 min-w-0">
                    </div>
                    <div class="flex items-center space-x-1 shrink-0">
                        <button onclick="moverColuna(${index}, -1)" ${index === 0 ? 'disabled class="text-zinc-600 cursor-not-allowed px-1.5 py-1 text-xs"' : 'class="text-zinc-300 hover:text-white px-1.5 py-1 text-xs bg-[#18181b] rounded"'}>⬆</button>
                        <button onclick="moverColuna(${index}, 1)" ${index === dadosApp.colunas.length - 1 ? 'disabled class="text-zinc-600 cursor-not-allowed px-1.5 py-1 text-xs"' : 'class="text-zinc-300 hover:text-white px-1.5 py-1 text-xs bg-[#18181b] rounded"'}>⬇</button>
                        <button onclick="deletarColuna('${col.id}')" class="text-red-400 hover:text-red-300 px-1.5 py-1 text-xs bg-[#18181b] rounded">🗑</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function moverColuna(index, direcao) {
            const novoIndex = index + direcao;
            if (novoIndex < 0 || novoIndex >= dadosApp.colunas.length) return;
            const temp = dadosApp.colunas[index];
            dadosApp.colunas[index] = dadosApp.colunas[novoIndex];
            dadosApp.colunas[novoIndex] = temp;
            renderizarListaConfigColunas();
        }

        function renomearColuna(id, novoNome) { const col = dadosApp.colunas.find(c => c.id === id); if (col) col.nome = novoNome; }
        function mudarCorColuna(id, novaCor) { const col = dadosApp.colunas.find(c => c.id === id); if (col) col.cor = novaCor; }
        function adicionarColunaPrompt() {
            const nome = prompt("Nome da nova coluna:");
            if (!nome) return;
            dadosApp.colunas.push({ id: 'col_' + Date.now(), nome, cor: 'bg-indigo-500' });
            renderizarListaConfigColunas();
        }
        function deletarColuna(id) {
            if (dadosApp.colunas.length <= 1) return alert('Mantenha ao menos uma coluna.');
            const primeiraRestante = dadosApp.colunas.find(c => c.id !== id).id;
            dadosApp.projetos.forEach(p => { if (p.status === id) p.status = primeiraRestante; });
            dadosApp.colunas = dadosApp.colunas.filter(c => c.id !== id);
            renderizarListaConfigColunas();
        }

        function salvarProjeto(e) {
            e.preventDefault();
            dadosApp.projetos.push({
                id: Date.now().toString(),
                abaId: dadosApp.abaAtiva,
                nome: document.getElementById('proj-nome').value,
                desc: document.getElementById('proj-desc').value,
                link: document.getElementById('proj-link').value,
                doc: document.getElementById('proj-doc').value,
                figma: document.getElementById('proj-figma').value,
                whimsical: document.getElementById('proj-whimsical').value,
                status: document.getElementById('proj-status').value
            });
            salvarDados();
            fecharModalProjeto();
        }

        function salvarAba(e) {
            e.preventDefault();
            const nomeAba = document.getElementById('aba-nome').value;
            const novaId = 'aba_' + Date.now();
            dadosApp.abas.push({ id: novaId, nome: nomeAba });
            dadosApp.abaAtiva = novaId;
            salvarDados();
            fecharModalAba();
        }

        function deletarProjeto(id) { dadosApp.projetos = dadosApp.projetos.filter(p => p.id !== id); salvarDados(); }
        function deletarAba(id) {
            if (dadosApp.abas.length <= 1) return alert('Você precisa ter pelo menos uma aba.');
            dadosApp.projetos = dadosApp.projetos.filter(p => p.abaId !== id);
            dadosApp.abas = dadosApp.abas.filter(a => a.id !== id);
            dadosApp.abaAtiva = dadosApp.abas[0].id;
            salvarDados();
        }

        carregarDadosDoSupabase();
    </script>
</body>
</html>
